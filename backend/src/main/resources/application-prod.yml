# Activate with SPRING_PROFILES_ACTIVE=prod (Render).
# No localhost defaults — missing DB_* or JWT_SECRET must fail the boot.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  photos:
    dir: ${PHOTO_DIR:/app/uploads}
