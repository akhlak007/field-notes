server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  error:
    include-stacktrace: never

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldnotes}
    username: ${DB_USER:fieldnotes}
    password: ${DB_PASSWORD:fieldnotes}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:field-notes-dev-secret-change-me-32bytes}
    access-token-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  photos:
    dir: ${PHOTO_DIR:./uploads}
